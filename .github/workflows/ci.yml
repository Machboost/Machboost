name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_test_dmg:
        description: Build an installable test DMG after all checks pass (no release)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-dmg:
    name: Installable test DMG
    if: github.event_name == 'workflow_dispatch' && inputs.build_test_dmg
    needs: [python, go, macos-app]
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install project generator
        run: |
          curl --fail --location --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 2 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --algorithm 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build community test DMG
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./scripts/release_macos.sh "$VERSION" --local
      - name: Verify bundled runtime and signature
        run: |
          APP="dist/macos/MachBoost.xcarchive/Products/Applications/MachBoost.app"
          PYTHONDONTWRITEBYTECODE=1 "$APP/Contents/Resources/runtime/python/bin/python3" -I -B -c \
            'import machboost, mlx, mlx_lm, mlx_vlm; print(machboost.__version__)'
          codesign --verify --deep --strict --verbose=2 "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: MachBoost-test-${{ github.sha }}
          path: |
            dist/macos/MachBoost-*-arm64.dmg
            dist/macos/MachBoost-*-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python package
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Check package metadata
        run: python -m pip install --dry-run .
      - name: Check CLI
        run: |
          machboost doctor --json
          machboost self-test --json

  go:
    name: Go CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
      - name: Run Go tests
        run: go test ./...

  macos-app:
    name: Native macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install daemon and project generator
        run: |
          python -m pip install -e .
          curl --fail --location --silent --show-error \
            --retry 4 \
            --retry-all-errors \
            --retry-delay 2 \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" \
            | shasum --algorithm 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Regenerate Xcode project
        working-directory: apps/macos
        run: |
          xcodegen generate
          git diff --exit-code MachBoost.xcodeproj
      - name: Validate macOS release scripts
        run: |
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
      - name: Resolve native dependencies
        run: |
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/SourcePackages" "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
            if xcodebuild -resolvePackageDependencies \
              -project apps/macos/MachBoost.xcodeproj \
              -scheme MachBoost \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
      - name: Run native unit tests
        env:
          MACHBOOST_SOURCE_ROOT: ${{ github.workspace }}
          MACHBOOST_TESTING: "1"
        run: |
          xcodebuild test \
            -project apps/macos/MachBoost.xcodeproj \
            -scheme MachBoost \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:MachBoostTests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=
      - name: Run native UI tests
        env:
          MACHBOOST_SOURCE_ROOT: ${{ github.workspace }}
          MACHBOOST_TESTING: "1"
        run: |
          xcodebuild test \
            -project apps/macos/MachBoost.xcodeproj \
            -scheme MachBoost \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            -only-testing:MachBoostUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            ENABLE_HARDENED_RUNTIME=NO
