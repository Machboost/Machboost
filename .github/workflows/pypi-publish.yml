name: Python Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/pypi-publish.yml"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "scripts/check_python_distributions.py"
  workflow_dispatch:
    inputs:
      version:
        description: Existing stable release version without v (for example 0.16.20)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Python distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Select released source and require successful main CI
        if: github.event_name != 'pull_request'
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid stable version"; exit 2; }
          git checkout --detach "refs/tags/v${VERSION}"
          git merge-base --is-ancestor HEAD origin/main
          SHA="$(git rev-parse HEAD)"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          for attempt in $(seq 1 80); do
            STATUS="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f head_sha="$SHA" -f branch=main -f event=push \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
            if [[ "$STATUS" -gt 0 ]]; then exit 0; fi
            sleep 15
          done
          echo "No successful main CI run for the release commit" >&2
          exit 1
      - name: Validate version
        id: version
        run: |
          python - <<'PY'
          import ast, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          assignments = ast.parse(pathlib.Path("machboost/__init__.py").read_text()).body
          package_version = next(ast.literal_eval(node.value) for node in assignments
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets))
          assert package_version == version, "Package and metadata versions differ"
          assert os.environ.get("RELEASE_VERSION", version) == version, "Tag and metadata versions differ"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PY
      - name: Build and inspect artifacts
        run: |
          python -m pip install build twine
          python -m build --outdir dist/pypi
          python -m twine check --strict dist/pypi/*
          python scripts/check_python_distributions.py dist/pypi '${{ steps.version.outputs.version }}'
      - name: Clean-install wheel and source archive
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$GITHUB_WORKSPACE"/dist/pypi/*; do
            ENV_DIR="$(mktemp -d)"
            python -m venv "$ENV_DIR"
            "$ENV_DIR/bin/python" -m pip install "$archive"
            "$ENV_DIR/bin/python" -m pip check
            (cd "$RUNNER_TEMP" && "$ENV_DIR/bin/python" -I -m machboost.cli version)
            (cd "$RUNNER_TEMP" && "$ENV_DIR/bin/python" -I -m machboost.cli self-test --json)
          done
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/pypi/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: github.event_name != 'pull_request' && github.repository == 'Machboost/Machboost'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/machboost
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Upload through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true

  verify:
    name: Verify public PyPI installation
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install from the public index
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/verify"
          PYTHON="$RUNNER_TEMP/verify/bin/python"
          for attempt in $(seq 1 10); do
            if "$PYTHON" -m pip install --no-cache-dir --index-url https://pypi.org/simple/ "machboost==$VERSION"; then break; fi
            sleep 15
          done
          "$PYTHON" -m pip check
          "$PYTHON" -I -c 'import machboost, os; assert machboost.__version__ == os.environ["VERSION"]'
          "$PYTHON" -I -m machboost.cli self-test --json
