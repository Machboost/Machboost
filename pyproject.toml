[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "machboost"
version = "0.16.20"
description = "Resident local inference server with conditional text and visual acceleration."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "vlm", "inference", "speculative-decoding", "local-ai", "mlx", "huggingface", "ollama", "server", "concurrency"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=2.1.1,<3",
]

[project.urls]
Homepage = "https://machboost.xyz"
Documentation = "https://github.com/Machboost/Machboost/blob/main/README.md"
Repository = "https://github.com/Machboost/Machboost"
Issues = "https://github.com/Machboost/Machboost/issues"
Changelog = "https://github.com/Machboost/Machboost/releases"

[project.optional-dependencies]
hf = [
  "torch",
  "transformers",
]
mlx = [
  "mlx>=0.32,<0.33",
  "mlx-lm>=0.31.3,<0.32",
  "mlx-vlm>=0.6.13,<0.7",
]
vision = [
  "mlx-vlm>=0.6.13,<0.7",
  "Pillow",
]
dflash = [
  "dflash-mlx>=0.1.8",
  "mlx>=0.32,<0.33",
  "mlx-lm>=0.31.3,<0.32",
]
video = [
  "Pillow",
]
all = [
  "torch",
  "transformers",
  "mlx>=0.32,<0.33",
  "mlx-lm>=0.31.3,<0.32",
  "mlx-vlm>=0.6.13,<0.7",
  "dflash-mlx>=0.1.8",
  "Pillow",
]

[project.scripts]
machboost = "machboost.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["machboost*"]
